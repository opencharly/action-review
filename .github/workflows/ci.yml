name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install charly (release assets, same as the gate bootstrap)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GH="$HOME/.local/charly"; mkdir -p "$GH/bin" "$GH/plugins"
          gh release download --repo opencharly/charly --pattern 'charly-linux-amd64' --pattern 'charly-plugins-linux-amd64.tar.gz' --dir "$GH" --clobber
          mv "$GH/charly-linux-amd64" "$GH/bin/charly" && chmod +x "$GH/bin/charly"
          tar -xzf "$GH/charly-plugins-linux-amd64.tar.gz" -C "$GH/plugins"
          echo "$GH/bin" >> "$GITHUB_PATH"
          echo "CHARLY_PLUGIN_DIR=$GH/plugins" >> "$GITHUB_ENV"
          "$GH/bin/charly" version
      - name: Verify the org pin the review gate runs (opencharly/.github#162)
        env:
          GH_TOKEN: ${{ github.token }}
          CHARLY_VERSION: ${{ vars.CHARLY_VERSION }}
        run: |
          # The REVIEW gate (.github/workflows/ai-review.yml) refuses to run an
          # unpublished engine: it enforces vars.CHARLY_VERSION and downloads exactly
          # that release. This step proves, on EVERY PR, the half of
          # opencharly/.github#162 that is verifiable in-tree — that the pin is SET,
          # visible to this repo, published, and that the binary it publishes reports
          # the version it names. An unenforced pin is how the gate silently ran
          # 2026.268.1917 while declaring v2026.271.0950 (#126).
          #
          # `charly box validate` below stays on the LATEST release ON PURPOSE: the pin's
          # engine predates the retired config stamp and REJECTS this stamp-less contract
          # (`schema 2026.261.1747 is required (found "")` — measured, and identical on
          # the pristine tree). Moving `box validate` onto the pin is therefore a single
          # org-variable change (advance the pin past the retirement), held by the
          # operator on opencharly/.github#162; the moment the pin accepts the contract,
          # it moves here. Nothing else is left: this step verifies the pin itself, and
          # ai-review.yml verifies the engine that runs under it.
          if [ -z "${CHARLY_VERSION:-}" ]; then
            echo "::error::vars.CHARLY_VERSION is unset or not visible to this repo — the review gate cannot enforce an engine pin"
            exit 1
          fi
          P="$HOME/.local/charly-pin"; mkdir -p "$P/bin"
          gh release download "$CHARLY_VERSION" --repo opencharly/charly \
            --pattern 'charly-linux-amd64' --dir "$P" --clobber
          mv "$P/charly-linux-amd64" "$P/bin/charly" && chmod +x "$P/bin/charly"
          WANT="${CHARLY_VERSION#v}"
          GOT="$("$P/bin/charly" version | grep -oE '[0-9]{4}\.[0-9]{3}\.[0-9]{4}' | head -1 || true)"
          echo "org pin $CHARLY_VERSION -> engine $GOT ($(sha256sum "$P/bin/charly" | cut -c1-12))"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::the pinned release $CHARLY_VERSION reports engine '$GOT' — the pin does not name the engine it installs"
            exit 1
          fi
      - name: config gates
        run: |
          charly box validate
          # The retired `--plan` mechanism is GONE (opencharly/.github#126, R5): no
          # plan file, no prompt file, no path knob in the contract. A reappearing
          # file would be a regression, so this gate asserts ABSENCE.
          for f in review-plan.yml prompt/validator.md; do
            [ ! -e "$f" ] || { echo "::error::$f is retired (opencharly/.github#126) but present"; exit 1; }
          done
          if grep -n 'REVIEW_PLAN_PATH\|REVIEW_PROMPT_PATH' charly.yml; then
            echo "::error::charly.yml still declares a retired review-path knob (opencharly/.github#126)"
            exit 1
          fi
          # The rulebook in force is the org variable AI_REVIEW_PROMPT, forwarded by
          # BOTH gates; charly.yml carries the committed default for the same knob.
          grep -q '^[[:space:]]*AI_REVIEW_PROMPT: |' charly.yml && echo PROMPT_OK
      - name: workflow lint (actionlint)
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

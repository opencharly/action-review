name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install charly (release assets, same as the gate bootstrap)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GH="$HOME/.local/charly"; mkdir -p "$GH/bin" "$GH/plugins"
          gh release download --repo opencharly/charly --pattern 'charly-linux-amd64' --pattern 'charly-plugins-linux-amd64.tar.gz' --dir "$GH" --clobber
          mv "$GH/charly-linux-amd64" "$GH/bin/charly" && chmod +x "$GH/bin/charly"
          tar -xzf "$GH/charly-plugins-linux-amd64.tar.gz" -C "$GH/plugins"
          echo "$GH/bin" >> "$GITHUB_PATH"
          echo "CHARLY_PLUGIN_DIR=$GH/plugins" >> "$GITHUB_ENV"
          "$GH/bin/charly" version
      - name: config gates
        run: |
          charly box validate
          # The retired `--plan` mechanism is GONE (opencharly/.github#126, R5): no
          # plan file, no prompt file, no path knob in the contract. A reappearing
          # file would be a regression, so this gate asserts ABSENCE.
          for f in review-plan.yml prompt/validator.md; do
            [ ! -e "$f" ] || { echo "::error::$f is retired (opencharly/.github#126) but present"; exit 1; }
          done
          if grep -n 'REVIEW_PLAN_PATH\|REVIEW_PROMPT_PATH' charly.yml; then
            echo "::error::charly.yml still declares a retired review-path knob (opencharly/.github#126)"
            exit 1
          fi
          # The rulebook in force is the org variable AI_REVIEW_PROMPT, forwarded by
          # BOTH gates; charly.yml carries the committed default for the same knob.
          grep -q '^[[:space:]]*AI_REVIEW_PROMPT: |' charly.yml && echo PROMPT_OK
      - name: workflow lint (actionlint)
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

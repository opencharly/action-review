name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the org-pinned charly and verify the pin names the engine it publishes (opencharly/.github#162)
        env:
          GH_TOKEN: ${{ github.token }}
          CHARLY_VERSION: ${{ vars.CHARLY_VERSION }}
        run: |
          # ONE engine in this job: the org pin. The review gate
          # (.github/workflows/ai-review.yml) refuses to run an unpublished engine — it
          # enforces vars.CHARLY_VERSION and downloads exactly that release — so the config
          # gate must validate the contract with the engine the gate RUNS, or it is green
          # for an engine no gate ever runs (opencharly/.github#126, #162).
          #
          # This step used to install the LATEST release for `charly box validate` while only
          # VERIFYING the pin here, because the pin of that day (v2026.271.0950) predated the
          # config-stamp retirement (charly#754 / umbrella #340) and rejected this stamp-less
          # contract. The pin has since advanced past that retirement, so the workaround is
          # gone. Measured 2026-07-14 with the pinned release v2026.278.0912 on this tree:
          #   charly box validate: OK — checked 5 candies, 7 distros, 7 builders; 0 warnings, 0 errors   (rc=0)
          # The same pinned engine now runs `box validate` below.
          if [ -z "${CHARLY_VERSION:-}" ]; then
            echo "::error::vars.CHARLY_VERSION is unset or not visible to this repo — the review gate cannot enforce an engine pin"
            exit 1
          fi
          P="$HOME/.local/charly-pin"; mkdir -p "$P/bin" "$P/plugins"
          gh release download "$CHARLY_VERSION" --repo opencharly/charly \
            --pattern 'charly-linux-amd64' --pattern 'charly-plugins-linux-amd64.tar.gz' --dir "$P" --clobber
          mv "$P/charly-linux-amd64" "$P/bin/charly" && chmod +x "$P/bin/charly"
          tar -xzf "$P/charly-plugins-linux-amd64.tar.gz" -C "$P/plugins"
          echo "$P/bin" >> "$GITHUB_PATH"
          echo "CHARLY_PLUGIN_DIR=$P/plugins" >> "$GITHUB_ENV"
          WANT="${CHARLY_VERSION#v}"
          GOT="$("$P/bin/charly" version | grep -oE '[0-9]{4}\.[0-9]{3}\.[0-9]{4}' | head -1 || true)"
          echo "org pin $CHARLY_VERSION -> engine $GOT ($(sha256sum "$P/bin/charly" | cut -c1-12))"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::the pinned release $CHARLY_VERSION reports engine '$GOT' — the pin does not name the engine it installs"
            exit 1
          fi
      - name: config gates (the org-pinned engine)
        run: |
          echo "config gate engine: $(charly version | grep -oE '[0-9]{4}\.[0-9]{3}\.[0-9]{4}' | head -1)"
          charly box validate
          # The retired `--plan` mechanism is GONE (opencharly/.github#126, R5): no
          # plan file, no prompt file, no path knob in the contract. A reappearing
          # file would be a regression, so this gate asserts ABSENCE.
          for f in review-plan.yml prompt/validator.md; do
            [ ! -e "$f" ] || { echo "::error::$f is retired (opencharly/.github#126) but present"; exit 1; }
          done
          if grep -n 'REVIEW_PLAN_PATH\|REVIEW_PROMPT_PATH' charly.yml; then
            echo "::error::charly.yml still declares a retired review-path knob (opencharly/.github#126)"
            exit 1
          fi
          # The rulebook in force is the org variable AI_REVIEW_PROMPT, forwarded by
          # BOTH gates; charly.yml carries the committed default for the same knob.
          grep -q '^[[:space:]]*AI_REVIEW_PROMPT: |' charly.yml && echo PROMPT_OK
      - name: workflow lint (actionlint)
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

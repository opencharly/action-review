# The ai-review gate — runs the plugin-review charly plugin on a STANDARD GitHub
# runner by default (ubuntu-latest); a self-hosted runner is an opt-in via
# vars.REVIEW_RUNNER_LABEL. Everything about WHICH plugins/steps run lives in
# review-plan.yml (via charly review --plan); this file never changes for that.
name: charly/pr-validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

concurrency:
  group: pr-validator-${{ github.repository }}-${{ inputs.pr-number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: validate
    runs-on: ${{ vars.REVIEW_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: ai-review
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: parseInt('${{ inputs.pr-number }}'),
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('node_id', pr.node_id);
      - uses: actions/checkout@v7
        with:
          ref: main
          path: runner-config
      - name: "Ensure charly (self-hosted image: no-op)"
        id: ensure-charly
        env:
          CHARLY_VERSION: ${{ vars.CHARLY_VERSION || '' }}
        run: |
          if command -v charly >/dev/null 2>&1; then
            echo "charly present: $(charly version)"; exit 0
          fi
          TAG="${CHARLY_VERSION:-$(gh release view --repo opencharly/charly --json tagName --jq .tagName)}"
          D="$HOME/.local/charly"; mkdir -p "$D/bin" "$D/plugins"
          gh release download "$TAG" --repo opencharly/charly \
            --pattern 'charly-linux-amd64' --pattern 'charly-plugins-linux-amd64.tar.gz' \
            --dir "$D" --clobber
          mv "$D/charly-linux-amd64" "$D/bin/charly" && chmod +x "$D/bin/charly"
          tar -xzf "$D/charly-plugins-linux-amd64.tar.gz" -C "$D/plugins"
          echo "$D/bin" >> "$GITHUB_PATH"
          echo "CHARLY_PLUGIN_DIR=$D/plugins" >> "$GITHUB_ENV"
          "$D/bin/charly" review --self-test
      - name: Run review plan (steps + runtime plugins declared in review-plan.yml)
        id: review
        env:
          PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
          AI_REVIEW_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER }}
          AI_REVIEW_MODEL:     ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_BASE_URL:  ${{ vars.AI_REVIEW_BASE_URL }}
          AI_REVIEW_MAX_TURNS: ${{ vars.AI_REVIEW_MAX_TURNS || '20' }}
          AI_REVIEW_API_KEY:   ${{ secrets.AI_REVIEW_API_KEY }}
          REVIEW_PROMPT_PATH:  ${{ github.workspace }}/runner-config/prompt/validator.md
          REVIEW_PLAN_PATH:    ${{ github.workspace }}/runner-config/review-plan.yml
          GITHUB_TOKEN:        ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/runner-config"
          charly review --plan review-plan --out /tmp/review.txt
      - name: Parse verdict
        id: parse
        run: |
          verdict='${{ steps.review.outputs.verdict }}'
          [ -n "$verdict" ] || { echo "::error::No verdict from plan executor"; exit 2; }
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
      - name: Gate (BLOCK)
        if: steps.parse.outputs.verdict == 'BLOCK'
        run: |
          echo "::error::AI review blocked this PR"
          exit 1
      - name: Gate (ambiguous)
        if: steps.parse.outputs.verdict != 'PASS' && steps.parse.outputs.verdict != 'BLOCK'
        run: |
          echo "::error::Ambiguous verdict from AI review"
          exit 2
      - name: Enable auto-merge
        if: steps.parse.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            rc=0
            out=$(gh pr merge --auto --squash "$PR_NUMBER" --repo "$REPO" 2>&1) || rc=$?
            echo "attempt $attempt rc=$rc: $out"
            [ "$rc" -eq 0 ] && break
            sleep 10
          done
          [ "$rc" -eq 0 ] || { echo "::warning::auto-merge arming did not settle; verdict is PASS"; }
